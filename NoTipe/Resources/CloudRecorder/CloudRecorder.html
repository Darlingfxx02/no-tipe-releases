 controls.querySelector('.settings-trigger').disabled=false;
}
function render(){
 const reading=hasReading();if(reading&&!settingsOpen)sessionExpanded=true;
 const voiceOnly=isVoiceOnly();
 const compact=layout==='cloud'&&!reading&&!voiceOnly;
 const controlPlacement=compact?'none':'embedded';
 const sameLayout=root.dataset.layout===layout;
 root.className=`design ${layout}${compact?' compact':''}${voiceOnly?' voice-only':''}`;
 root.dataset.state=state;root.dataset.translation=translation;root.dataset.processing=[...processing].join(' ')||'none';root.dataset.layout=layout;root.dataset.controlStyle=usesSplitControls()?'split':'unified';
 // Preserve the shell itself so CSS can interpolate actual old and new bounds.
 // Keep the cloud controls as well, so every phase shares the same moving elements.
 if(!sameLayout||!root.querySelector('.shell')){
  root.innerHTML=`<div class="shell">${layout==='cloud'?'<div class="visual" id="visual"><div class="fallback"></div></div>':''}</div>${layout==='satellite'?'<div class="orb-anchor"><div class="visual" id="visual"><div class="fallback"></div></div><span class="orb-caption"></span></div>':''}`;
  const start=retainedGeometry[layout];root.querySelector('.shell').style.cssText=`width:${start.width}px;height:${start.height}px`;
 }
 const shell=root.querySelector('.shell');shell.classList.toggle('no-text',!reading);
 if(!shell.querySelector('.language-chips'))shell.insertAdjacentHTML('afterbegin',languageMarkup());
 if(!shell.querySelector('.settings-blur-zone'))shell.insertAdjacentHTML('beforeend','<div class="settings-blur-zone" id="settingsBlurZone" aria-hidden="true" hidden><i></i><i></i><i></i></div>');
 if(!reading)shell.querySelector('.reading')?.remove();
 else if(!shell.querySelector('.reading'))shell.insertAdjacentHTML('beforeend',readMarkup());
 else{
  shell.querySelector('#liveText').textContent=shown;
  const caret=shell.querySelector('.live-caret');
  if(state!=='recording')caret?.remove();
  else if(!caret)shell.querySelector('.transcript').insertAdjacentHTML('beforeend','<span class="live-caret" aria-hidden="true"></span>');
 }
 root.querySelector('.cloud-trigger')?.remove();
 root.dataset.controls=controlPlacement;
 if(layout==='cloud'){
  if(!shell.querySelector('.toolbar'))shell.insertAdjacentHTML('beforeend',toolbar());
  syncCloudControls(shell.querySelector('.toolbar'),reading||voiceOnly);
  if(!usesSplitControls())updateCloudControlsReveal(renderer.expansion);
 }else{
  root.querySelector('.toolbar')?.remove();
  shell.insertAdjacentHTML('beforeend',toolbar());
 }
 // The compact start target overlays inert controls while they fade with the shell.
 if(compact){
  const action=state==='result'?'show-error':state==='failed'||state==='copied'?'close':busyStates.has(state)?'cancel':'record';
  const label=state==='result'?'Готово. Закрыть':state==='copied'?'Текст в буфере обмена. Закрыть':state==='failed'?'Ошибка. Вернуться в ожидание':state==='recording'?'Остановить запись':state==='preparing'?'Подготовка. Отменить обработку':state==='busy'?'Другая запись активна':'Начать запись';
  shell.insertAdjacentHTML('beforeend',`<button class="cloud-trigger" data-action="${action}" aria-label="${label}" title="${label}" ${state==='busy'?'disabled':''}><span class="sr-only" id="compactStatusText" role="status">${escapeHTML(status())}</span></button>`);
 }
 const caption=root.querySelector('.orb-caption');if(caption)caption.textContent=state==='result'?'Готово':state==='preparing'?'Подготовка':state==='recording'?'Голос':'No Type';
 const visual=$('visual');
 if(state==='result'&&layout!=='cloud'){
  visual.dataset.action='close';visual.setAttribute('role','button');visual.setAttribute('tabindex','0');visual.setAttribute('aria-label','Готово. Вернуться в ожидание');
 }else{delete visual.dataset.action;for(const attr of ['role','tabindex','aria-label'])visual.removeAttribute(attr);}
 if(canvas.parentElement!==visual)visual.append(canvas);if(renderer.error)failRenderer();
 model.sizes.expanded.width=layout==='pill'?39:89.6;model.sizes.expanded.height=layout==='pill'?28:63;
 syncSettings();updateGeometry();requestAnimationFrame(()=>{updateTranscriptViewport();draw(0);reportHitRegions();});
}
// Runs inside the native cloud controller closure.
let nativeLevel=0,nativePeak=0,nativeActive=true,lastRegions='',regionTime=0;
const post=(action,detail={})=>window.webkit?.messageHandlers?.cloudRecorder?.postMessage({action,...detail});
function draw(delta){
 if(!canvas.isConnected)return;
 updateTranscriptViewport(delta);
 const target=state==='recording'&&!recordingPaused?voiceDrive(nativeLevel,nativePeak):0;
 audioLevel=paused?target:mix(audioLevel,target,1-Math.exp(-delta/(target>audioLevel?.025:.12)));
 const audio={low:audioLevel,mid:audioLevel*.82,high:audioLevel*.58};model.tick(delta,audio);
 renderer.render({surface:model.surface,sizes:model.sizes,progress:model.progress},audio,delta,undefined,originalAppearance);
}
let audioLevel=0;
function reportHitRegions(){
 const shell=root.querySelector('.shell');if(!shell)return;
 const elements=[shell,...root.querySelectorAll('.toolbar:not([inert]) button,.language-chip[data-visible="true"]')];
 const regions=elements.map(element=>{const r=element.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height)};});
 const key=JSON.stringify(regions);if(key!==lastRegions){lastRegions=key;post('regions',{regions});}
}
function frame(now){
 raf=0;const delta=Math.min(.05,Math.max(0,(now-last)/1000));last=now;time+=delta;
 draw(delta);regionTime+=delta;if(regionTime>.032){regionTime=0;reportHitRegions();}
 if(nativeActive&&!paused&&!document.hidden)raf=requestAnimationFrame(frame);
}
function schedule(){if(!raf&&nativeActive&&!paused&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
function resetHiddenSession(){
 // Keep user preferences, but discard every transient state and spring. Merely
 // selecting idle would leave the completion tint fading on the next opening.
 state='idle';settingsOpen=false;translationPickerOpen=false;recordingPaused=false;
 nativeLevel=nativePeak=audioLevel=time=regionTime=0;lastRegions='';resetSession();
 model=pn();model.select('idle');renderer.resetMotion();
 for(let i=0;i<120;i++)model.tick(1/60,{low:0,mid:0,high:0});
 // Snap layout while hidden; don't replay the previous expanded geometry.
 root.dataset.resetting='true';render();
 root.getBoundingClientRect();draw(0);renderer.gl?.finish();reportHitRegions();
 delete root.dataset.resetting;
}
function toggleSettings(focusSettings=false){
 settingsOpen=!settingsOpen;translationPickerOpen=settingsOpen&&translation!=='off';render();
 if(focusSettings)root.querySelector(settingsOpen?'[data-action="translation-picker"]':'[data-action="settings"]')?.focus({preventScroll:true});
}
function toggleTranslationPicker(){
 if(translation==='off'){translation=lastTranslation;translationPickerOpen=true;}
 else{lastTranslation=translation;translation='off';translationPickerOpen=false;}
 post('translation',{value:translation});syncSettings();
}
root.addEventListener('click',e=>{
 const option=e.target.closest('[data-setting]');
 if(option){
  const value=option.dataset.value;
  if(option.dataset.setting==='translation'){translation=lastTranslation=value;post('translation',{value:translation});}
  else {const enabled=!processing.has(value);if(enabled)processing.add(value);else processing.delete(value);post('processing',{value,enabled});}
  syncSettings();return;
 }
 const button=e.target.closest('[data-action]');
 if(button&&!button.disabled){
  const action=button.dataset.action;
  if(action==='settings')return toggleSettings(e.detail===0);
  if(action==='translation-picker')return toggleTranslationPicker();
  post(action==='show-error'?'close':action==='retry'?'record':action);return;
 }
 // The central wave finishes dictation; Play/Pause only suspends the microphone.
 if(e.target.closest('.status-area')&&state==='recording')post('finish');
});
root.addEventListener('keydown',e=>{
 const option=e.target.closest('[data-setting="translation"]');if(!option)return;
 const items=[...root.querySelectorAll('[data-setting="translation"]')],index=items.indexOf(option);
 const next=e.key==='ArrowRight'?(index+1)%items.length:e.key==='ArrowLeft'?(index-1+items.length)%items.length:-1;
 if(next>=0){e.preventDefault();items[next].focus({preventScroll:true});}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){e.preventDefault();if(settingsOpen)toggleSettings();else post('cancel');}
 if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();post('finish');}
});
window.noTipe={
 update(snapshot){
  const next=['idle','recording','preparing','result','copied','busy','failed'].includes(snapshot.state)?snapshot.state:'idle';
  const changed=state!==next;
  if(changed){settingsOpen=false;translationPickerOpen=false;if(next==='idle'||next==='recording')resetSession();}
  state=next;palette=resolveTheme(snapshot.palette);chromatic=snapshot.chromatic===true;live=snapshot.showTranscript===true;hiddenStyle=snapshot.hiddenStyle==='unified'?'unified':'split';
  const appearanceValue=(value,fallback,maximum=1)=>Number.isFinite(value)?Math.max(0,Math.min(maximum,value)):fallback;
  recorderScale=Math.max(.6,appearanceValue(snapshot.recorderScale,1));
  lightIntensity=appearanceValue(snapshot.lightIntensity,.28,2);
  waveBrightness=appearanceValue(snapshot.waveBrightness,.35,4);
  showDictationWaves=snapshot.showDictationWaves!==false;applyTheme();
  recordingPaused=snapshot.paused===true;
  translation=['off','english','russian'].includes(snapshot.translation)?snapshot.translation:'off';
  if(translation!=='off')lastTranslation=translation;
  translationPickerOpen=settingsOpen&&translation!=='off';
  processing.clear();if(snapshot.enhance)processing.add('enhance');if(snapshot.shorten)processing.add('shorten');
  // Only the original dictation is accepted; processing output never comes here.
  if(state==='recording')shown=typeof snapshot.transcript==='string'?snapshot.transcript:'';
  renderer.setCompletion(state==='result'||state==='copied'||state==='failed');
  const visualState=processingStates.has(state)||state==='result'||state==='copied'||state==='failed'?'thinking':state==='recording'&&!recordingPaused?'listening':'idle';
  if(model.state!==visualState)model.select(visualState);
  if(paused)for(let i=0;i<120;i++)model.tick(1/60,{low:0,mid:0,high:0});
  render();
  reportHitRegions();
  const wave=root.querySelector('.status-area');if(wave){wave.setAttribute('title','Завершить диктовку');wave.setAttribute('role','button');wave.setAttribute('aria-label','Завершить диктовку');wave.tabIndex=0;wave.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();post('finish');}};}
  schedule();
 },
 audio(level,peak=level){nativeLevel=Number.isFinite(level)?Math.max(0,Math.min(1,level)):0;nativePeak=Number.isFinite(peak)?Math.max(0,Math.min(1,peak)):nativeLevel;},
 active(value){
  nativeActive=value===true;
  if(!nativeActive){cancelAnimationFrame(raf);raf=0;resetHiddenSession();}
  else {draw(0);schedule();}
 }
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;}else schedule();});
reduce.addEventListener('change',e=>{paused=e.matches;cancelAnimationFrame(raf);raf=0;window.noTipe.update({state,showTranscript:live,hiddenStyle,paused:recordingPaused,transcript:shown,translation,enhance:processing.has('enhance'),shorten:processing.has('shorten'),palette,chromatic,lightIntensity,waveBrightness,showDictationWaves,recorderScale});});
window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);renderer.dispose();});
new ResizeObserver(()=>{reportHitRegions();if(paused)draw(0);}).observe(root);
window.noTipe.update({state:'idle',showTranscript:true});
for(let i=0;i<120;i++)model.tick(1/60,{low:0,mid:0,high:0});draw(0);schedule();post('ready');
})();
</script></body></html>
