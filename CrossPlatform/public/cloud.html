.language-chips{--language-gap:8px;position:absolute;left:0;right:0;bottom:calc(100% + var(--language-gap));z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:var(--language-gap);pointer-events:none}
.language-chip{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;flex:0 0 auto;min-height:36px;padding:8px 12px;border-radius:18px;background:transparent;box-shadow:none;color:var(--reading-color);font-size:var(--reading-font-size);font-weight:400;line-height:1.6;white-space:nowrap;opacity:0;transform-origin:center center;will-change:transform,opacity}
.language-chips::before{content:"";width:36px;flex:0 0 36px;align-self:stretch;pointer-events:none}
.language-chip--icon{position:absolute;left:0;bottom:0;width:36px;height:36px;border-radius:50%;padding:0;color:#fff;transition:color .18s ease}
.language-chip--icon[data-enabled="true"]{color:#38d67a}
.language-chip--icon svg{width:18px;height:18px}
.language-options{display:contents}
.language-chip[inert]{pointer-events:none}
.language-toggle-glyph{display:grid;place-items:center;width:20px;height:20px}
.language-toggle-glyph svg{grid-area:1/1}
.language-chips[data-open="true"]{pointer-events:auto}
.language-chip[aria-checked="true"]{color:#fff}
/* The two original No Type layouts retain their ordinary panel material. */
.design:not(.cloud) .language-chip{background:linear-gradient(155deg,#211c32,#0c0a15 58%,#231b38);border:1px solid #9d91d43b;transform:translateY(24px) scale(.9);transition:opacity .22s,transform .38s cubic-bezier(.2,.8,.3,1)}
.design:not(.cloud) .language-chips[data-open="true"] .language-chip[data-visible="true"]{opacity:1;transform:none}
.design:not(.cloud) .language-chip--icon[aria-expanded="true"],.cloud:has(.visual.failed) .language-chip--icon[aria-expanded="true"]{background:radial-gradient(ellipse at 50% 75%,#090e0b,#020403);border-color:#67957b25}
.cloud .visual{top:-108px;bottom:-20px;height:calc(100% + 128px);left:-110px;right:-110px;width:calc(100% + 220px)}
.cloud[data-control-style="split"] .toolbar{left:0;right:0;bottom:0;height:63px}
.cloud[data-control-style="split"] .toolbar .record,.cloud[data-control-style="split"] .toolbar .settings-trigger{position:absolute;top:50%;width:var(--split-hit-size,32px);height:var(--split-hit-size,32px);min-width:0;border-radius:50%;transform:translate(-50%,-50%)}
.cloud[data-control-style="split"] .toolbar .record{left:var(--split-left,50%)}
.cloud[data-control-style="split"] .toolbar .settings-trigger{left:var(--split-right,50%)}
.properties .row{flex-wrap:wrap}.properties select{margin-left:6px}
.cloud .shell::after{display:none!important}
.cloud:has(.visual.failed) .language-chips[data-open="true"] .language-chip{background:#181326;border:1px solid #9d91d43b}
.language-check{display:block;width:12px;flex:none;text-align:center;font-size:12px;opacity:0;transform:scale(.5);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.2,.32,1)}
.language-chip[aria-checked="true"] .language-check{opacity:1;transform:scale(1)}
.language-chip:focus-visible{outline:2px solid #e0dfff;outline-offset:-3px}
.language-short{display:none}
.language-chips[data-short="true"] .language-full{display:none}
.language-chips[data-short="true"] .language-short{display:inline}
.inline-settings button:focus-visible{outline:2px solid #9ea3df;outline-offset:-2px}
.inline-settings .setting-option:focus-visible{outline:none}
.setting-option:focus-visible .setting-switch{outline:2px solid #b5b6ed;outline-offset:-2px}
.inline-settings button:focus:not(:focus-visible){outline:none}
.toolbar .settings-trigger[aria-expanded="true"]{color:#b5b9f4}
.design{--reading-font-size:13px;--reading-color:#e0e0e8}
.reading .transcript,.reading .setting-option{font-size:var(--reading-font-size);font-weight:400;line-height:1.6;color:var(--reading-color)}
@media(max-width:420px){.design{--reading-font-size:12px}}
@keyframes content-fade{from{opacity:0}to{opacity:1}}
.cloud[data-chromatic="true"] .shell::after{background:linear-gradient(#08080812 65%,transparent)}
.design:is([data-state="idle"],[data-state="recording"]) .visual.failed .fallback{opacity:var(--wave-brightness,.35)}
.design[data-dictation-waves="false"]:is([data-state="idle"],[data-state="recording"]) .visual.failed .fallback{display:none}

html,body{width:100%;height:100%;min-width:0;margin:0;background:transparent!important;overflow:hidden;color-scheme:dark;user-select:none}
body{display:flex;align-items:flex-end;justify-content:center;padding:0 30px 20px}
.design{width:100%;max-width:520px;padding:0!important}
.cloud .reading{padding-left:24px;padding-right:24px}
.cloud .toolbar{left:16px;right:16px;bottom:calc(var(--toolbar-height,63px)/2 - 16px)}
.cloud[data-control-style="split"] .toolbar{bottom:0;height:var(--toolbar-height,63px)}
.cloud .shell::after{pointer-events:none}
.cloud .status-area{height:32px;cursor:pointer;pointer-events:auto}
.design[data-resetting="true"],.design[data-resetting="true"] *{transition:none!important;animation:none!important}
.transcript-frame{position:relative;flex:1;min-height:0;max-height:125px}
.reading .transcript-frame .text-scroll{height:100%;max-height:none;overflow:clip;overflow-anchor:none}
.transcript-frame .transcript{will-change:transform}
.transcript-overflow{position:absolute;left:0;top:-10px;display:flex;gap:3px;align-items:center;height:7px;opacity:0;transition:opacity .12s;pointer-events:none}
.transcript-overflow i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.65}
.transcript-frame[data-overflow="true"] .transcript-overflow{opacity:1}
