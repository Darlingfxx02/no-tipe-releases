[package]
name = "no-tipe-desktop"
version = "0.1.11"
description = "No Type desktop dictation application"
license = "Apache-2.0"
authors = ["Darlingfxx02"]
edition = "2021"

[lib]
name = "no_tipe_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
dev-channel = []

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "fs", "macros"] }
futures-util = "0.3"
cpal = "0.16"
hound = "3.5"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
arboard = "3"
dirs = "6"
libc = "0.2"
plist = "1"
sha2 = "0.10"
url = "2"
regex = "1"
symphonia = { version = "0.5", features = ["all"] }
whisper-rs = { version = "0.16", features = ["raw-api"] }
rubato = "0.16"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tauri-plugin-updater = "2.13.1"
sys-locale = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Foundation"] }

[profile.release]
lto = "thin"
strip = true
debug = 0
debug-assertions = false
codegen-units = 1

[dev-dependencies]
minisign-verify = "0.2.5"
